[project]
name = "dawoni"
version = "0.0.1"
description = "다워니 — 구독 중인 AI CLI를 일꾼으로 부려, 교재 개념 범위 안에서 해설·루브릭을 만들고 강사 기준에 맞춰 서술형 답안을 채점하는 학원 강사용 도구"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "fastapi>=0.162.0",
    "jinja2>=3.1",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.3",
    "opencv-python-headless>=4.12",
    "pillow>=11",
    "pydantic>=2.12",
    # 1.28.2 고정: 이후 판은 3.16용 빌드가 없는 onnxruntime을 요구 (2026-10-27)
    "pymupdf==1.28.2",
    "pypandoc-binary>=1.17",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "pywebview>=6.2.1 ; sys_platform == 'darwin'",
    "qrcode>=8.2",
    "schemdraw>=0.23",
    "sympy>=1.14",
    "uvicorn>=0.54.0",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
dawoni = "dawoni.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
    "pyright>=1.1.400",
    "types-lxml>=2026.2.16",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dawoni"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "T20"]
ignore = [
    "RUF001",  # 한글·수학 기호(①, ×, −)는 의도된 문자
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"tests/test_ingest.py" = ["E501"]  # 한글 시험지 픽스처 데이터 (줄을 나누면 오히려 읽기 어려움)
"tests/test_docx.py" = ["E501"]  # 같은 이유 (시험지 문항 픽스처)
"tests/test_calibration.py" = ["E501"]  # 채점 응답 픽스처
"tests/test_server.py" = ["E501"]
"tests/test_generate.py" = ["E501"]
"tests/test_figures.py" = ["E501"]
"tests/test_grading.py" = ["E501"]
"tests/test_new_problem.py" = ["E501"]  # 새 문제 응답 픽스처
"tests/test_bank.py" = ["E501"]  # 문항 픽스처

[tool.pyright]
include = ["dawoni", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not agent'"
filterwarnings = [
    # PyMuPDF(SWIG)가 Python 3.16에서 내는 경고 — 우리 코드와 무관
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
    "ignore:'typing.ByteString' and 'collections.abc.ByteString' are deprecated:DeprecationWarning",
]
markers = [
    "agent: 실제 AI CLI를 호출하는 테스트 (기본 제외, `-m agent`로 실행)",
]
