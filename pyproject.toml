[project]
name = "dawoni"
version = "0.0.1"
description = "다워니 — 구독 중인 AI CLI를 일꾼으로 부려, 교재 개념 범위 안에서 해설·루브릭을 만들고 강사 기준에 맞춰 서술형 답안을 채점하는 학원 강사용 도구"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "jinja2>=3.1",
    "pillow>=11",
    "pydantic>=2.12",
    # 1.28.2 고정: 이후 판은 3.16용 빌드가 없는 onnxruntime을 요구 (2026-10-27)
    "pymupdf==1.28.2",
    "sympy>=1.14",
]

[project.scripts]
dawoni = "dawoni.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
    "pyright>=1.1.400",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dawoni"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "T20"]
ignore = [
    "RUF001",  # 한글·수학 기호(①, ×, −)는 의도된 문자
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]

[tool.pyright]
include = ["dawoni", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not agent'"
filterwarnings = [
    # PyMuPDF(SWIG)가 Python 3.16에서 내는 경고 — 우리 코드와 무관
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
    "ignore:'typing.ByteString' and 'collections.abc.ByteString' are deprecated:DeprecationWarning",
]
markers = [
    "agent: 실제 AI CLI를 호출하는 테스트 (기본 제외, `-m agent`로 실행)",
]
