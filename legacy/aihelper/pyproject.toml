[project]
name = "aihelper"
version = "0.1.33"

description = "학원 강사용 AI 도우미 — 구독 중인 AI(CLI)를 연결해 자료 DB화·해설·동형문제·채점을 돕는 데스크톱 앱"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pywebview>=5.0",
    "pythonnet>=3.0.3; platform_system == 'Windows'",
    "clr_loader>=0.2.6; platform_system == 'Windows'",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "sympy>=1.12",
    "matplotlib>=3.8",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "youtube-transcript-api>=0.6.2",
    "latex2mathml>=3.81.1",
    "math2docx>=3.1.0",
    "qrcode>=7.4",
]

[project.scripts]
aihelper = "aihelper.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aihelper*"]

[tool.setuptools.package-data]
aihelper = ["web/*", "web/**/*"]
