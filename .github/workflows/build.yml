# 배포 파일 만들기: macOS .dmg (Apple Silicon) + Windows .zip (Dawoni.exe)
# - 직접 실행(Actions 탭 → Build → Run workflow) 또는 `v*` 태그를 올리면 돈다 (push마다 돌지 않음)
# - 태그면 Release에 두 파일을 올린다. 직접 실행이면 실행 결과의 Artifacts에서 받는다.
# - 서명 없음: Windows는 SmartScreen "추가 정보 → 실행", macOS는 "개인정보 보호 및 보안 → 그래도 열기"
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: mac
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.15"
          enable-cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 화면 빌드
        working-directory: frontend
        run: npm ci && npm run build

      - name: 의존성
        run: uv sync --group build

      # Windows 테스트는 아직 한 번도 돈 적이 없음 → 실패해도 빌드는 계속 (결과는 로그로 확인)
      - name: 테스트
        continue-on-error: ${{ matrix.name == 'windows' }}
        run: uv run pytest

      - name: 묶기 (PyInstaller)
        run: uv run --group build pyinstaller packaging/dawoni.spec --noconfirm --distpath dist --workpath build

      - name: 스모크 검사 (mac)
        if: matrix.name == 'mac'
        run: uv run python packaging/smoke.py dist/Dawoni.app/Contents/MacOS/Dawoni

      - name: 스모크 검사 (windows)
        if: matrix.name == 'windows'
        run: uv run python packaging/smoke.py dist/Dawoni/Dawoni.exe

      - name: dmg 만들기
        if: matrix.name == 'mac'
        run: |
          mkdir -p stage
          cp -R dist/Dawoni.app stage/
          ln -s /Applications stage/Applications
          hdiutil create -volname "다워니" -srcfolder stage -ov -format UDZO "Dawoni-mac-arm64.dmg"
          echo "PKG=Dawoni-mac-arm64.dmg" >> "$GITHUB_ENV"

      - name: zip 만들기
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Dawoni -DestinationPath Dawoni-windows-x64.zip
          "PKG=Dawoni-windows-x64.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v5
        with:
          name: Dawoni-${{ matrix.name }}
          path: ${{ env.PKG }}
          if-no-files-found: error

      - name: Release에 올리기
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PKG }}
          prerelease: true
          generate_release_notes: true
